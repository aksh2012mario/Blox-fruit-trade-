:root{--bg:#07070a;--panel:#101015;--panel2:#15151d;--line:#24242e;--text:#f4f4f7;--muted:#9999a7;--purple:#9a6cff;--purple2:#6e43d9;--green:#35d39a;--yellow:#ffc34d;--red:#ff5e73}

x}.value{font-size:30px;font-weight:900;margin-top:14px}.trend{color:var(--muted);margin-top:5px}.demand{margin-top:14px;color:var(--muted);font-size:13px}.bars{display:flex;gap:5px;margin-top:7px}.bar{height:9px;flex:1;border-radius:8px;background:#26262e}.bar.on{background:var(--green)}.bar.warn{background:var(--yellow)}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;color:var(--muted);font-size:13px}.meta b{display:block;color:#ddd;margin-top:4px}.panel{background:rgba(16,16,21,.9);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:900px}.panel h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field label{display:block;color:#aaa;margin-bottom:7px;font-weight:700}.btnrow{display:flex;gap:10px;flex-wrap:wrap}.error{color:#ff8798;margin:10px 0}.trade{background:#0d0d12;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.trade h3{margin:0 0 8px}.trade small{color:var(--muted)}.chat{max-height:350px;overflow:auto;background:#08080b;border:1px solid var(--line);border-radius:12px;padding:12px}.msg{padding:9px 0;border-bottom:1px solid #1d1d24}.msg:last-child{border-bottom:0}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.pic{height:230px}.navin{gap:15px;padding:14px}.wrap{padding:18px 12px 45px}.meta{grid-template-columns:1fr 1fr}}

.navin{max-width:1500px}
.logo{letter-spacing:.2px}

.trade{position:relative;overflow:hidden;background:linear-gradient(145deg,#12121a,#0b0b10);border-color:#2d2940;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .16s ease,border-color .16s ease}.trade:hover{transform:translateY(-2px);border-color:#59458c}
.trade:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--purple),var(--green))}

.create-preview{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.preview-card{padding:15px;border:1px solid #292934;border-radius:14px;background:#0a0a0f}.preview-card .label{font-size:12px;color:#858595}.preview-card .item{font-size:18px;font-weight:900;margin-top:5px}.setup-note{margin-top:12px;padding:12px;border-radius:12px;background:#0b1220;border:1px solid #223957;color:#b9cce8;font-size:13px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#171722;border:1px solid #3a3350;color:#fff;padding:12px 16px;border-radius:13px;box-shadow:0 15px 40px rgba(0,0,0,.4);transition:.22s;z-index:99}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

function hasFirebaseConfig(c){return c&&c.apiKey&&c.apiKey!=="PASTE_API_KEY"&&c.projectId&&c.projectId!=="PASTE_PROJECT"&&c.databaseURL&&c.databaseURL.indexOf('PASTE_PROJECT')===-1}
function initFirebase(){
  firebaseReady=false; authReady=false; db=null;
  if(!window.firebase||!hasFirebaseConfig(FIREBASE_CONFIG))return;
  try{
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
    firebase.auth().signInAnonymously().then(()=>{authReady=true;firebaseReady=true;startRealtime();}).catch(err=>{console.warn('Firebase auth failed',err);showToast('Firebase login failed — check Anonymous Auth');});
  }catch(e){console.warn('Firebase init failed',e);showToast('Firebase setup error');}
}

const CATALOG=CATALOG_DATA;
// Permanent values: add/adjust these numbers later if you want different values. Missing entries fall back to regular value.
const PERM_VALUES={"Rocket":1000000,"Spin":7000000,"Blade":50000000,"Spring":20000000,"Bomb":50000000,"Smoke":25000000,"Flame":50000000,"Ice":50000000,"Sand":60000000,"Dark":70000000,"Diamond":80000000,"Light":90000000,"Rubber":120000000,"Barrier":90000000,"Ghost":120000000,"Magma":120000000,"Quake":150000000,"Buddha":250000000,"Love":170000000,"Spider":150000000,"Sound":250000000,"Phoenix":180000000,"Portal":250000000,"Blizzard":280000000,"Spirit":300000000,"Venom":300000000,"Control":350000000,"Gas":400000000,"Yeti":600000000,"Kitsune":800000000,"Leopard":500000000,"Dough":450000000,"T-Rex":350000000};
CATALOG_DATA.forEach(c=>{if(c.permValue==null&&PERM_VALUES[c.name]!=null)c.permValue=PERM_VALUES[c.name];});
let user=localStorage.getItem('bft_user')||''; let pageState='values'; let filter='All'; let query='';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n){if(n===0)return'N/A'; if(n>=1e9)return(n/1e9).toFixed(n%1e9?2:0)+'B'; if(n>=1e6)return(n/1e6).toFixed(n%1e6?2:0)+'M'; if(n>=1e3)return(n/1e3).toFixed(n%1e3?1:0)+'K'; return String(n)}
function img(c){return c.image?`<img src="${c.image}" loading="lazy">`:'<div class="fallback">🍈</div>'}
function nav(){return `<div class="nav"><div class="navin"><a class="logo" href="#" onclick="go('values')">Blox <span>Fruits</span> Trader</a>${user?`<a href="#" onclick="go('values')">Values</a><a href="#" onclick="go('calc')">Calculator</a><a href="#" onclick="go('create')">Create Trade</a><a href="#" onclick="go('trades')">Trades</a><a href="#" onclick="go('setup')">Setup</a><a href="#" onclick="logout()">Logout</a>`:`<a href="#" onclick="go('login')">Login</a>`}</div></div>`}
function card(c){let bars='';for(let i=1;i<=10;i++)bars+=`<span class="bar ${i<=c.demand?(c.trend==='Unstable'||c.trend==='Fluctuating'?'warn':'on'):''}"></span>`;return `<div class="card"><div class="pic">${img(c)}</div><div class="cardbody"><div class="row"><div class="name">${esc(c.name)}</div><span class="badge">${esc(c.category)}</span></div><div class="value">${money(c.value)}</div><div class="trend">${esc(c.trend)}</div><div class="demand">Demand ${c.demand}/10</div><div class="bars">${bars}</div><div class="meta"><div>Beli / Price<b>${esc(c.price)}</b></div><div>Type<b>${esc(c.kind)}</b></div></div></div></div>`}
function values(){let mode=localStorage.getItem('bft_value_mode')||'regular',order=localStorage.getItem('bft_sort_order')||'desc';let arr=CATALOG.filter(c=>(filter==='All'||c.category===filter)&&c.name.toLowerCase().includes(query.toLowerCase()));arr.sort((a,b)=>{let av=mode==='perm'?(a.permValue??a.value):a.value,bv=mode==='perm'?(b.permValue??b.value):b.value;return order==='desc'?bv-av:av-bv});return `<div class="hero"><h1>Values</h1><p class="sub">Choose Regular or Permanent values and sort either way.</p></div><div class="toolbar"><div class="search"><input placeholder="Search fruit or item..." value="${esc(query)}" oninput="query=this.value;render()"></div><div class="tabs">${['All','Fruits','Gamepasses','Limited'].map(x=>`<button class="${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><select onchange="localStorage.setItem('bft_value_mode',this.value);render()"><option value="regular" ${mode==='regular'?'selected':''}>Regular Value</option><option value="perm" ${mode==='perm'?'selected':''}>Permanent Value</option></select><select onchange="localStorage.setItem('bft_sort_order',this.value);render()"><option value="desc" ${order==='desc'?'selected':''}>Highest → Lowest</option><option value="asc" ${order==='asc'?'selected':''}>Lowest → Highest</option></select></div></div><div class="grid">${arr.length?arr.map(c=>card({...c,value:mode==='perm'?(c.permValue??c.value):c.value})).join(''):'<div class="empty">No matching items.</div>'}</div>`}
function login(){return `<div class="hero"><h1>Login</h1><p class="sub">This is a local website account — never enter your Roblox password.</p></div><div class="panel"><div class="field"><label>Username</label><input id="lu"></div><div class="field"><label>Website password</label><input id="lp" type="password"></div><div id="le" class="error"></div><button class="btn primary" onclick="doLogin()">Login</button><p class="sub" style="margin-top:15px">No account? <a href="#" onclick="go('register')" style="color:#b493ff">Create one</a></p></div>`}
function register(){return `<div class="hero"><h1>Create Account</h1><p class="sub">Use any display name. This does not connect to Roblox.</p></div><div class="panel"><div class="field"><label>Username</label><input id="ru"></div><div class="field"><label>Website password</label><input id="rp" type="password"></div><div id="re" class="error"></div><button class="btn primary" onclick="doRegister()">Register</button></div>`}
function accounts(){return JSON.parse(localStorage.getItem('bft_accounts')||'{}')}
function doRegister(){let u=$('#ru').value.trim(),p=$('#rp').value;if(u.length<3||p.length<6){$('#re').textContent='Username must be 3+ characters and password 6+ characters.';return}let a=accounts(),k=u.toLowerCase();if(a[k]){$('#re').textContent='Username already exists on this device.';return}a[k]={u,p};localStorage.setItem('bft_accounts',JSON.stringify(a));localStorage.setItem('bft_user',u);user=u;go('values')}
function doLogin(){let u=$('#lu').value.trim(),p=$('#lp').value,a=accounts(),x=a[u.toLowerCase()];if(!x||x.p!==p){$('#le').textContent='Invalid username or website password.';return}user=x.u;localStorage.setItem('bft_user',user);go('values')}
function logout(){localStorage.removeItem('bft_user');user='';go('login')}
function opts(){return CATALOG.filter(c=>c.category==='Fruits').map(c=>`<option value="${esc(c.name)}">${esc(c.name)} — ${money(c.value)}</option>`).join('')}
function calc(){return `<div class="hero"><h1>Trade Calculator</h1><p class="sub">Compare up to three fruits on each side.</p></div><div class="panel"><div class="formgrid"><div><h2>Give</h2><select id="g1">${opts()}</select><select id="g2" style="margin-top:8px"><option value="">None</option>${opts()}</select><select id="g3" style="margin-top:8px"><option value="">None</option>${opts()}</select></div><div><h2>Want</h2><select id="w1">${opts()}</select><select id="w2" style="margin-top:8px"><option value="">None</option>${opts()}</select><select id="w3" style="margin-top:8px"><option value="">None</option>${opts()}</select></div></div><div id="result" style="margin-top:18px"></div><button class="btn primary" onclick="calculate()">Calculate</button></div>`}
function sum(ids){return ids.map(id=>$(id).value).filter(Boolean).reduce((s,n)=>s+(CATALOG.find(c=>c.name===n)?.value||0),0)}
function calculate(){let g=sum(['g1','g2','g3']),w=sum(['w1','w2','w3']),d=w-g,p=g?d/g:0;let r=p>0.05?'WIN':p<-0.05?'LOSS':'FAIR';$('#result').innerHTML=`<div class="trade"><h3>${r}</h3><p>Give: <b>${money(g)}</b> &nbsp; Want: <b>${money(w)}</b></p><small>Difference: ${money(Math.abs(d))}</small></div>`}
function create(){return `<div class="hero"><h1>Create Trade ✨</h1><p class="sub">Make an offer and let other traders find you.</p></div><div class="panel"><div class="create-preview"><div class="preview-card"><div class="label">YOU GIVE</div><div class="item" id="givePreview">Choose an item</div></div><div class="preview-card"><div class="label">YOU WANT</div><div class="item" id="wantPreview">Choose an item</div></div></div><div class="formgrid"><div class="field"><label>🎁 You give</label><select id="cg" onchange="updateTradePreview()">${opts()}</select></div><div class="field"><label>🔎 You want</label><select id="cw" onchange="updateTradePreview()">${opts()}</select></div></div><div class="field"><label>Message</label><input id="cm" maxlength="120" placeholder="Example: LF fair offers / DM me"></div><div class="setup-note">${firebaseReady?'🟢 Multiplayer is connected. Your listing will be visible to other connected users.':'🟡 Local mode right now. Add your Firebase config and enable Anonymous Authentication + Realtime Database to make trades multiplayer.'}</div><div class="btnrow" style="margin-top:14px"><button class="btn primary" onclick="postTrade()">🚀 Post Trade</button><button class="btn" onclick="go('trades')">View Trades</button></div></div>`}
function updateTradePreview(){let g=$('#cg')?.value||'Choose an item',w=$('#cw')?.value||'Choose an item';if($('#givePreview'))$('#givePreview').textContent=g;if($('#wantPreview'))$('#wantPreview').textContent=w}
function postTrade(){
  let g=$('#cg')?.value?.trim(),w=$('#cw')?.value?.trim(),m=$('#cm')?.value?.trim()||'';
  if(!user){go('login');return}
  if(!g||!w){showToast('Choose both sides of the trade');return}
  let now=Date.now();
  let trade={user:user,give:g,want:w,message:m,createdAt:now,chat:[]};
  if(firebaseReady&&db&&firebase.auth().currentUser){
    let ref=db.ref('trades').push();
    trade.id=ref.key;
    ref.set(trade).then(()=>{showToast('Trade posted! 🎉');go('trades')}).catch(err=>{console.error(err);showToast('Could not post. Check Firebase Rules.');});
    return;
  }
  trade.id='local_'+now+'_'+Math.random().toString(36).slice(2,8);
  let ts=JSON.parse(localStorage.getItem('bft_trades')||'[]');ts.unshift(trade);localStorage.setItem('bft_trades',JSON.stringify(ts));
  showToast('Trade saved on this device');go('trades');
}
function timeAgo(ts){if(!ts)return'';let d=Math.max(0,Date.now()-ts),m=Math.floor(d/60000);if(m<1)return'just now';if(m<60)return m+'m ago';let h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}
function trades(){
  let ts=firebaseReady?remoteList():JSON.parse(localStorage.getItem('bft_trades')||'[]');
  let status=firebaseReady?'<span class="status-pill on">● Multiplayer ON</span>':'<span class="status-pill local">● Local mode</span>';
  let out='<div class="hero"><h1>Trade Hub 🤝</h1><p class="sub">Find offers, open a chat, and make your next trade.</p><div style="margin-top:14px">'+status+'</div></div>';
  if(!ts.length)return out+'<div class="panel" style="text-align:center;margin:auto"><h2>No trades yet</h2><p class="sub">Be the first trader to post an offer.</p><div style="margin-top:15px"><button class="btn primary" onclick="go(\'create\')">🚀 Create First Trade</button></div></div>';
  out+='<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0"><h2 style="margin:0">Latest Offers</h2><button class="btn primary" onclick="go(\'create\')">+ Create Trade</button></div>';
  out+=ts.map(t=>'<div class="trade"><div class="trade-head"><div class="trade-user">👤 '+esc(t.user||'Player')+'</div><div class="trade-time">'+esc(timeAgo(t.createdAt))+'</div></div><div class="trade-flow"><div class="trade-side"><small>YOU GIVE</small><b>'+esc(t.give||'')+'</b></div><div class="trade-arrow">⇄</div><div class="trade-side"><small>YOU WANT</small><b>'+esc(t.want||'')+'</b></div></div>'+(t.message?'<div class="sub" style="margin-bottom:13px">💬 '+esc(t.message)+'</div>':'')+'<div class="trade-actions"><button class="btn primary" onclick="openTrade(\''+esc(t.id)+'\')">💬 Open Chat</button></div></div>').join('');
  return out;
}
function openTrade(id){
  function drawTrade(t, chat){
    let rows=chat&&chat.length?chat.map(m=>'<div class="msg"><b>'+esc(m.user||'Player')+'</b>: '+esc(m.text||'')+'</div>').join(''):'<div class="sub">No messages yet.</div>';
    document.querySelector('#app').innerHTML=nav()+'<main class="wrap"><div class="hero"><h1>Trade Chat 💬</h1><p class="sub">'+esc(t.user||'Player')+' — '+esc(t.give||'')+' → '+esc(t.want||'')+'</p></div><div class="panel"><div id="chatbox" class="chat">'+rows+'</div><div class="btnrow" style="margin-top:12px"><input id="chattext" style="flex:1;min-width:200px" placeholder="Message"><button class="btn primary" onclick="sendChat(\''+esc(id)+'\')">Send</button></div></div></main>';
  }
  if(firebaseReady&&db){
    db.ref('trades/'+id).once('value').then(s=>{
      let t=s.val();
      if(!t)return go('trades');
      drawTrade(t,Object.values(t.chat||{}));
      db.ref('trades/'+id+'/chat').on('value',snap=>{
        let box=$('#chatbox');
        if(!box)return;
        let a=Object.values(snap.val()||{});
        box.innerHTML=a.length?a.map(m=>'<div class="msg"><b>'+esc(m.user||'Player')+'</b>: '+esc(m.text||'')+'</div>').join(''):'<div class="sub">No messages yet.</div>';
      });
    }).catch(()=>{showToast('Could not open this trade.');go('trades')});
    return;
  }
  let ts=JSON.parse(localStorage.getItem('bft_trades')||'[]'),t=ts.find(x=>String(x.id)===String(id));
  if(!t)return go('trades');
  drawTrade(t,t.chat||[]);
}
function sendChat(id){let v=$('#chattext')?.value.trim();if(!v)return;if(firebaseReady&&db){db.ref('trades/'+id+'/chat').push({user:user||'Player',text:v,createdAt:Date.now()});if($('#chattext'))$('#chattext').value='';return}let ts=JSON.parse(localStorage.getItem('bft_trades')||'[]'),t=ts.find(x=>String(x.id)===String(id));if(t){t.chat=t.chat||[];t.chat.push({user:user||'Player',text:v});localStorage.setItem('bft_trades',JSON.stringify(ts));}openTrade(id)}
function setup(){let c=FIREBASE_CONFIG;return `<div class="hero"><h1>Multiplayer Setup ⚡</h1><p class="sub">Paste your Firebase Web App config here. Never paste a service-account private key.</p></div><div class="panel"><div class="formgrid"><div class="field"><label>apiKey</label><input id="f_apiKey" value="${esc(c.apiKey)}"></div><div class="field"><label>authDomain</label><input id="f_authDomain" value="${esc(c.authDomain)}"></div><div class="field"><label>databaseURL</label><input id="f_databaseURL" value="${esc(c.databaseURL)}"></div><div class="field"><label>projectId</label><input id="f_projectId" value="${esc(c.projectId)}"></div><div class="field"><label>storageBucket</label><input id="f_storageBucket" value="${esc(c.storageBucket)}"></div><div class="field"><label>messagingSenderId</label><input id="f_messagingSenderId" value="${esc(c.messagingSenderId)}"></div><div class="field"><label>appId</label><input id="f_appId" value="${esc(c.appId)}"></div></div><div class="setup-note">After saving: Firebase Console → Authentication → Sign-in method → enable <b>Anonymous</b>. Then create Realtime Database and use authenticated-only rules. Firebase documents anonymous auth and realtime push writes for multiuser apps. cite</div><div class="btnrow" style="margin-top:14px"><button class="btn primary" onclick="saveFirebaseSetup()">💾 Save & Connect</button><button class="btn" onclick="clearFirebaseSetup()">Reset</button></div></div>`}
function saveFirebaseSetup(){let c={apiKey:$('#f_apiKey').value.trim(),authDomain:$('#f_authDomain').value.trim(),databaseURL:$('#f_databaseURL').value.trim(),projectId:$('#f_projectId').value.trim(),storageBucket:$('#f_storageBucket').value.trim(),messagingSenderId:$('#f_messagingSenderId').value.trim(),appId:$('#f_appId').value.trim()};if(!hasFirebaseConfig(c)){showToast('Please fill the Firebase config');return}localStorage.setItem('bft_firebase_config',JSON.stringify(c));FIREBASE_CONFIG=c;showToast('Config saved — connecting...');setTimeout(()=>location.reload(),350)}
function clearFirebaseSetup(){localStorage.removeItem('bft_firebase_config');location.reload()}
function go(p){if(!user&&['values','calc','create','trades'].includes(p))p='login';pageState=p;render()}
function render(){let body=pageState==='values'?values():pageState==='login'?login():pageState==='register'?register():pageState==='calc'?calc():pageState==='create'?create():pageState==='setup'?setup():trades();document.querySelector('#app').innerHTML=nav()+`<main class="wrap">${body}</main>`}
render();
</script></body></html>
